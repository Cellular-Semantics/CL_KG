name: YAML schema validator
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [ main ]
    paths:
      - 'cl_kb_pipeline/config/dumps/neo4j2owl-config.yaml'
      - 'cl_kb_pipeline/config/dumps/neo4j2owl_config_schema.json'
      - 'cl_kb_pipeline/src/**'
      - 'cl_kb_pipeline/pyproject.toml'
      - 'cl_kb_pipeline/uv.lock'
      - '.github/workflows/schema_validator.yaml'
permissions:
    pull-requests: write

jobs:
  yaml-schema-validation:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up uv and Python 3.10
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.0"
        python-version: "3.10"
    - name: Install dependencies (cl_kb_pipeline/uv.lock)
      run: uv sync --frozen --no-dev --project cl_kb_pipeline
    - name: Schema validation
      id: schema
      run: |
        uv run --frozen --no-dev --project cl_kb_pipeline python cl_kb_pipeline/src/validate_neo2owl_config.py
    - name: Prepare schema validator comment
      if: failure()
      run: |
        echo "cl_kb_pipeline/config/dumps/neo4j2owl-config.yaml file failed the schema validation check   " > comment.md; cat validation.report >> comment.md
    - name: Prepare success comment
      run: |
        echo "cl_kb_pipeline/config/dumps/neo4j2owl-config.yaml file passed validation check   " > comment.md
    - name: Post comment validator comment
      if: always()
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      uses: NejcZdovc/comment-pr@v1.1.1
      with:
        file: "../../comment.md"
