name: Tests and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  RUFF_VERSION: "0.17.1"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff check (settings in ruff.toml)
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions match each module's runtime (Dockerfile / schema CI job).
          - module: translator_api_mapper
            python: "3.10"
          - module: cl_kb_pipeline
            python: "3.8"
          - module: bitmap_query_service
            python: "3.13"
          - module: graph_query_service
            python: "3.13"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          working-directory: ${{ matrix.module }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.module }}/uv.lock
      - name: Install (locked, incl. dev group)
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q tests

  # anndata2rdf builds pygraphviz from source against the system Graphviz, so it
  # is tested on the production image's base (python:3.10 = Debian trixie,
  # Graphviz 2.42). pygraphviz 1.14 does not compile against Graphviz >= 13,
  # which current ubuntu-latest runners ship.
  test-anndata2rdf:
    name: test (anndata2rdf)
    runs-on: ubuntu-latest
    container: python:3.10
    defaults:
      run:
        working-directory: anndata2rdf
    env:
      UV_PYTHON_PREFERENCE: only-system  # use the image's Python, like the Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System packages (as in anndata2rdf/Dockerfile)
        run: apt-get update && apt-get install -y --no-install-recommends libgraphviz-dev pkg-config libhdf5-dev
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: anndata2rdf
          enable-cache: true
          cache-dependency-glob: anndata2rdf/uv.lock
      - name: Install (locked, incl. dev group)
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q tests
