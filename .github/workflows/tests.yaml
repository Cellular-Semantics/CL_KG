name: Tests and lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  RUFF_VERSION: "0.17.1"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff check (settings in ruff.toml)
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions match each module's runtime (Dockerfile / schema CI job).
          - module: anndata2rdf
            python: "3.10"
            apt: libgraphviz-dev  # needed to build pygraphviz
          - module: translator_api_mapper
            python: "3.10"
          - module: cl_kb_pipeline
            python: "3.8"
          - module: bitmap_query_service
            python: "3.13"
          - module: graph_query_service
            python: "3.13"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          working-directory: ${{ matrix.module }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.module }}/uv.lock
      - name: Install (locked, incl. dev group)
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q tests
