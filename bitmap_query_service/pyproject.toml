[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitmap-query-service"
version = "0.1.0"
description = "FastAPI service that serves precomputed cell-cluster roaring bitmaps"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pyroaring",
    "uvicorn[standard]",
]

[dependency-groups]
# Test-only: not installed in the Docker image (uv sync --no-dev).
dev = [
    "httpx",  # required by fastapi.testclient
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bitmap_query_service"]
